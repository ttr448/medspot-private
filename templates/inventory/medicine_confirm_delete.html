{% extends "base.html" %}
{% block title %}Delete Medicine{% endblock %}
{% block content %}
  <h1 class="h3 mb-3">Delete Medicine</h1>
  <p>Are you sure you want to delete <strong>{{ inventory.medicine.name }}</strong> from your inventory?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'pharmacies:dashboard' %}" class="btn btn-link">Cancel</a>
  </form>
{% endblock %}
